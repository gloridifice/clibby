name: Release

on:
  push:
    tags:
      - "v*"

# Required to create and upload GitHub Releases with the repository GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest

    steps:
      - name: Validate release tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use the vX.Y.Z format; got '$env:TAG'."
          }

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $packageName = "clibby-$env:TAG-x86_64-pc-windows-msvc"
          $packageDirectory = Join-Path $env:RUNNER_TEMP $packageName
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          Copy-Item target/release/clb.exe (Join-Path $packageDirectory 'clb.exe')
          Copy-Item README.md (Join-Path $packageDirectory 'README.md')

          $archive = Join-Path $env:RUNNER_TEMP "$packageName.zip"
          Compress-Archive -Path $packageDirectory -DestinationPath $archive -Force
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          Set-Content -NoNewline -Path $checksum -Value "$hash *$packageName.zip"

          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ARCHIVE $env:CHECKSUM --clobber
          } else {
            gh release create $env:TAG $env:ARCHIVE $env:CHECKSUM --title "clibby $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
